services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_highlights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applies drizzle/*.sql in sort order on first container init only (empty volume).
      - ./drizzle:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
